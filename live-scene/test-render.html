<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{width:1920px;height:1080px;display:block}</style></head><body>
<canvas id="c" width="960" height="540"></canvas>
<script src="alberta-shader.js"></script>
<script>
var Q = new URLSearchParams(location.search), num = function(k,d){ return Q.has(k) ? +Q.get(k) : d; };
var LOC = {
  moraine: { cam:[0,0.15,0.15], tgt:[0,0.5,4], fov:1.5, wall:[3.6,1.6,1.4,4.0], slab:[0,0,0,0], side:[0.5,0.42,0.0,0.12], lake:[1.05,-0.6,2.9,0.0], forest:[0.95,0.6,0.045,0], cabin:[0,0,0,0], heroes:[[-1.05,0.7,0.5,1],[1.1,0.8,0.55,1],[-1.25,1.2,0.4,1],[1.3,1.3,0.42,1]], seed:0.13 },
  rundle: { cam:[0,0.14,0.1], tgt:[0.25,0.45,4], fov:1.55, wall:[5.2,0.6,0.9,4.5], slab:[0.55,3.2,1.25,1], side:[0.3,0.35,0.0,0.05], lake:[1.4,-0.6,2.4,0.0], forest:[0.95,0.5,0.045,0], cabin:[0,0,0,0], heroes:[[-1.1,0.6,0.5,1],[1.2,0.7,0.52,1],[-1.35,1.0,0.4,1],[0,0,0,0]], seed:0.41 },
  peyto: { cam:[0,0.95,-0.3], tgt:[0.15,0.55,4], fov:1.45, wall:[4.6,1.25,1.1,4.0], slab:[0,0,0,0], side:[1.1,0.95,0.6,0.35], lake:[0.32,1.6,4.2,0.2], forest:[0.9,0.7,0.035,0], cabin:[0,0,0,0], heroes:[[-0.5,0.55,0.4,1],[0.62,0.65,0.42,1],[0,0,0,0],[0,0,0,0]], seed:0.77 },
  cabin: { cam:[0,0.12,-0.2], tgt:[0,0.38,4], fov:1.55, wall:[4.2,1.05,1.2,4.0], slab:[0,0,0,0], side:[0.4,0.35,0.0,0.1], lake:[0.5,2.0,2.8,-0.5], forest:[0.85,0.55,0.03,1], cabin:[0.12,0.95,0.07,1], heroes:[[-0.5,0.6,0.42,1],[0.66,0.7,0.45,1],[-0.75,0.95,0.32,1],[0.9,1.0,0.3,1]], seed:0.29 }
};
var L = LOC[Q.get('loc') || 'moraine'];
var c = document.getElementById('c'), gl = c.getContext('webgl', { preserveDrawingBuffer: true });
function sh(type, src){ var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { document.title = 'ERR ' + gl.getShaderInfoLog(s); throw new Error(gl.getShaderInfoLog(s)); } return s; }
function prog(fs){ var p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, AlbertaShader.VERT)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs)); gl.bindAttribLocation(p, 0, 'aPos'); gl.linkProgram(p); return p; }
var buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
function tex(){ var t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 960, 540, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  [gl.TEXTURE_MIN_FILTER, gl.TEXTURE_MAG_FILTER].forEach(function(k){ gl.texParameteri(gl.TEXTURE_2D, k, gl.LINEAR); }); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  var f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0); return { t: t, f: f }; }
var A = tex(), P1 = prog(AlbertaShader.SCENE), P2 = prog(AlbertaShader.PAINT);
var sunAlt = num('alt', 25) * Math.PI/180, sunAz = num('az', 200) * Math.PI/180;   // az relative: 180 = straight ahead... compass-free test
function dir(alt, rel){ return [Math.sin(rel)*Math.cos(alt), Math.sin(alt), Math.cos(rel)*Math.cos(alt)]; }
var sun = dir(sunAlt, num('rel', -40) * Math.PI/180), moon = dir(num('malt', 20)*Math.PI/180, num('mrel', 15)*Math.PI/180);
gl.useProgram(P1); gl.bindFramebuffer(gl.FRAMEBUFFER, A.f); gl.viewport(0,0,960,540);
function u(n){ return gl.getUniformLocation(P1, n); }
gl.uniform2f(u('uRes'), 960, 540);
gl.uniform3fv(u('uCamPos'), L.cam); gl.uniform3fv(u('uCamTgt'), L.tgt); gl.uniform1f(u('uFov'), L.fov);
gl.uniform3fv(u('uSun'), sun); gl.uniform3fv(u('uMoon'), moon); gl.uniform1f(u('uMoonLit'), num('moonlit', 0.8));
var night = Math.min(1, Math.max(0, (-sunAlt*180/Math.PI - 4) / 10));
gl.uniform1f(u('uCloud'), num('cloud', 0.3)); gl.uniform1f(u('uFog'), num('fog', 0)); gl.uniform1f(u('uSnow'), num('snow', 0)); gl.uniform1f(u('uWet'), num('wet', 0)); gl.uniform1f(u('uNight'), night);
gl.uniform1f(u('uFrozen'), num('frozen', 0)); gl.uniform1f(u('uGlow'), num('glow', night)); gl.uniform2f(u('uCloudOff'), 0.3, 0.1); gl.uniform1f(u('uSnowLine'), num('snowline', 0.9)); gl.uniform1f(u('uAutumn'), num('autumn', 0)); gl.uniform1f(u('uOvercast'), num('overcast', 0));
gl.uniform4fv(u('uWall'), L.wall); gl.uniform4fv(u('uSlab'), L.slab); gl.uniform4fv(u('uSide'), L.side); gl.uniform4fv(u('uLake'), L.lake); gl.uniform4fv(u('uForest'), L.forest); gl.uniform4fv(u('uCabin'), L.cabin);
for (var i=0;i<4;i++) gl.uniform4fv(u('uHero'+i), L.heroes[i]);
gl.uniform1f(u('uSeed'), L.seed); gl.uniform1f(u('uDebug'), num('debug', 0));
var t0 = performance.now(); setTimeout(function(){
gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.useProgram(P2);
gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, A.t);
gl.uniform1i(gl.getUniformLocation(P2,'uTex'), 0); gl.uniform2f(gl.getUniformLocation(P2,'uRes'), 960, 540); gl.uniform1f(gl.getUniformLocation(P2,'uRad'), num('rad', 4.5));
if (num('debug',0) > 3.5) gl.uniform1f(gl.getUniformLocation(P2,'uRad'), 0.0001); if (Q.get('raw')) { /* show raw by painting with radius 0 */ gl.uniform1f(gl.getUniformLocation(P2,'uRad'), 0.0001); }
gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
var px = new Uint8Array(4); gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
document.title = "DONE " + Math.round(performance.now() - t0) + "ms"; }, 50);
</script></body></html>
